[project]
name = "legacy-pyconvert"
version = "0.1.1"
description = "Deploy or Die: convert legacy Python 2 to Python 3 and prove behavioral equivalence via sandboxed diffing."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
]

[project.scripts]
legacy-pyconvert = "cli.convert:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli", "shared"]
