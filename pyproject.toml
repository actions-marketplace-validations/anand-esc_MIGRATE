[project]
name = "legacy-pyconvert"
version = "0.1.2"
description = "Deploy or Die: convert legacy Python 2 to Python 3 and prove behavioral equivalence via sandboxed diffing."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "hypothesis>=6.165.1",
    "deepdiff>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
legacy-pyconvert = "cli.convert:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
