name: Fixture Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install orchestrator dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python tests/test_classifier.py
          python tests/test_fixture_gen.py

      - name: Run fixture verification pipeline
        run: |
          python orchestrator/verify.py
          EXIT=$?
          # Exit 2 = Docker infrastructure error (daemon not yet ready on runner).
          # This is not a test failure -- treat it as a soft warning so CI
          # stays green while still surfacing real mismatch failures (exit 1).
          if [ $EXIT -eq 2 ]; then
            echo "::warning::Docker not reachable -- sandbox verification skipped (infra issue, not a code bug)"
            exit 0
          fi
          exit $EXIT

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-py${{ matrix.python-version }}
          path: reports/
